<title>내돈내찾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 한 손 모바일 앱. 큰 제목 → 주간 마감 스트립 → 필터 → 마감 구간별 리스트 그룹 → 바텀시트 상세 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --fill:#f2f4f6; --line:#e5e8eb;
  --fg:#191f28; --fg2:#4e5968; --fg3:#8b95a1;
  --accent:#3182f6; --on-accent:#ffffff;
  --danger:#f04452; --school:#3182f6; --youth:#03b26c; --gov:#f08c00;
  --scrim:rgba(0,0,0,.42); --shadow:0 8px 32px rgba(0,23,51,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r-group:20px; --r-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101014; --surface:#1c1c22; --fill:#2a2a32; --line:#2c2c35;
  --fg:#f2f2f4; --fg2:#b4b4bd; --fg3:#7e7e88;
  --accent:#4a93fb; --danger:#ff5b6b; --school:#4a93fb; --youth:#1fc483; --gov:#ffa43a;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101014; --surface:#1c1c22; --fill:#2a2a32; --line:#2c2c35;
  --fg:#f2f2f4; --fg2:#b4b4bd; --fg3:#7e7e88;
  --accent:#4a93fb; --danger:#ff5b6b; --school:#4a93fb; --youth:#1fc483; --gov:#ffa43a;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 32px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 10px;display:flex;flex-direction:column;gap:14px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.school-btn{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--fg2);background:var(--surface);padding:7px 12px;border-radius:var(--r-pill)}
.lede{margin:-8px 0 0;color:var(--fg2);font-size:15px}
.lede b{color:var(--danger);font-weight:700}

/* 주간 스트립 */
.week{background:var(--surface);border-radius:var(--r-group);padding:14px 10px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:14px;transition:background .15s}
.day .dw{font-size:12px;color:var(--fg3);font-weight:500}
.day .dd{font-size:17px;font-weight:700;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.today .dd{background:var(--fg);color:var(--bg)}
.day .dots{height:6px;display:flex;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--danger)}
.day.sel{background:var(--fill)}
.day.empty{cursor:default}
.day.sun .dw{color:var(--danger)}

/* 필터 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:15px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--fg2);transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .c{margin-left:4px;opacity:.6;font-weight:500}

.notice{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--fg2);background:var(--surface);border-radius:14px;padding:12px 14px}
.notice svg{flex:none;margin-top:2px}

/* 리스트 그룹 */
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-size:15px;font-weight:700;color:var(--fg2);margin:0;padding-inline:4px;display:flex;justify-content:space-between}
.group h2 span{color:var(--fg3);font-weight:500}
.list{background:var(--surface);border-radius:var(--r-group);padding:6px 0;list-style:none;margin:0}
.row{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;text-align:left;transition:background .12s}
.row:active{background:var(--fill)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--src);background:color-mix(in srgb,var(--src) 14%,transparent)}
.s-school{--src:var(--school)} .s-youth{--src:var(--youth)} .s-gov{--src:var(--gov)}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:16px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.m{font-size:13px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .amt{color:var(--fg2);font-weight:500}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dday{font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;color:var(--fg2);background:var(--fill)}
.dday.hot{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.dday.soon{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.saved-mark{color:var(--danger);height:14px}
.verify{font-size:11px;font-weight:600;color:var(--gov)}

.empty-state{background:var(--surface);border-radius:var(--r-group);padding:40px 24px;text-align:center;color:var(--fg3);font-size:15px}
.empty-state strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

/* 바텀시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);
  max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.src-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--src)}
.src-tag i{width:6px;height:6px;border-radius:50%;background:var(--src)}
.sheet h3{font-size:22px;line-height:1.35;font-weight:800;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance;word-break:keep-all}
.big-d{display:flex;align-items:baseline;gap:10px}
.big-d strong{font-size:34px;font-weight:800;letter-spacing:-.03em}
.big-d strong.hot{color:var(--danger)} .big-d strong.soon{color:var(--accent)}
.big-d span{color:var(--fg2);font-size:15px}
.facts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.fact dt{color:var(--fg3)} .fact dd{margin:0;font-weight:500;word-break:keep-all}
.summary{background:var(--fill);border-radius:16px;padding:16px;font-size:15px;color:var(--fg2)}
.summary b{display:block;font-size:13px;color:var(--fg3);margin-bottom:4px;font-weight:600}
.docs h4{font-size:17px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between}
.docs h4 span{font-size:14px;color:var(--fg3);font-weight:500}
.doc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;font-size:16px;text-align:left}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .15s}
.doc[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.doc[aria-checked="true"] .lbl{color:var(--fg3);text-decoration:line-through}
.box svg{opacity:0} .doc[aria-checked="true"] .box svg{opacity:1}
.warn{font-size:13px;color:var(--gov);background:color-mix(in srgb,var(--gov) 12%,transparent);padding:10px 12px;border-radius:12px}
.actions{display:grid;grid-template-columns:auto auto 1fr;gap:8px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.btn{height:56px;border-radius:16px;font-size:17px;font-weight:700;display:grid;place-items:center;text-decoration:none}
.btn.sub{width:56px;background:var(--fill);color:var(--fg2)}
.btn.sub[aria-pressed="true"]{color:var(--danger)}
.btn.main{background:var(--accent);color:var(--on-accent)}
.sub-t{margin:6px 0 0;color:var(--fg2);font-size:15px}
.label{font-size:14px;font-weight:600;color:var(--fg3);margin:0 0 8px 4px}
.opts{display:flex;flex-direction:column;gap:2px;background:var(--fill);border-radius:16px;padding:4px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 22px;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;text-align:left;transition:background .15s}
.opt[aria-checked="true"]{background:var(--surface)}
.opt b{display:block;font-size:16px;font-weight:600}
.opt small{display:block;font-size:13px;color:var(--fg3);margin-top:2px;word-break:keep-all}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);transition:border .15s}
.opt[aria-checked="true"] .radio{border:7px solid var(--accent)}
.hint{font-size:13px;color:var(--fg3);margin:8px 4px 0}
.actions.one{grid-template-columns:1fr}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel-wrap{position:relative;min-width:0}
.sel-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--fg3)}
.select{appearance:none;-webkit-appearance:none;width:100%;height:52px;border:0;border-radius:14px;padding:0 36px 0 16px;font:inherit;font-size:16px;font-weight:600;color:var(--fg);background:var(--fill);cursor:pointer}
.select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{background:var(--surface);border-radius:var(--r-group);padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px}
.hero .eb{font-size:15px;font-weight:600;color:var(--fg2)}
.hero .big{font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.035em}
.hero .big em{font-style:normal;color:var(--accent)}
.hero .cap{font-size:13px;color:var(--fg3);margin:2px 0 10px;word-break:keep-all}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill-btn{height:48px;border-radius:14px;font-size:15px;font-weight:700;background:var(--fill);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.pill-btn.primary{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
/* 줄바꿈 정리: 여러 줄 문장은 줄 길이를 고르게, 한두 글자만 다음 줄로 넘어가지 않게 */
.t,.foot,.cap,.hint,.opt small,.summary,.warn,.notice span,.fact dd,.empty-state,.sub-t{text-wrap:balance}
/* 문장 단위 줄바꿈: 문장 하나를 한 덩어리로 보고, 한 줄에 안 들어갈 때만 그 안에서 단어 단위로 줄바꿈 */
.s{display:inline-block;max-width:100%;text-wrap:balance}
.ad-slot{width:100vw;margin-left:calc(50% - 50vw);min-height:102px}
.foot{font-size:13px;line-height:1.65;color:var(--fg3);text-align:center;padding:4px 12px 0;word-break:keep-all;margin:0}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;
  background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;padding:12px 18px;border-radius:14px;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1 id="h1">내돈내찾</h1>
      <button class="school-btn" id="schoolBtn" aria-label="내 정보 바꾸기"><span id="schoolName">단국대</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="lede" id="lede"></p>
    <div class="chips" role="group" aria-label="분류" id="chips"></div>
  </header>

  <section class="hero" id="hero" aria-label="받을 수 있는 돈"></section>
  <section class="week" id="week" aria-label="이번 주 마감"></section>
  <div class="notice" id="sampleNotice" hidden>
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>지금은 예시 공고예요. 수집기를 돌리면 <b>feed.json</b>의 실제 공고로 바뀌어요.</span>
  </div>
  <main id="groups" class="wrap" style="gap:24px"></main>
  <div id="adSlot" class="ad-slot" aria-label="광고" hidden></div>
  <p class="foot">설정과 찜은 이 기기에만 저장하고 어디로도 보내지 않아요.<br>금액과 날짜는 각 기관 공고 기준이고, 실제 지급은 심사로 정해져요.<br>신청 전에 원문을 꼭 확인하세요.</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden><div class="sheet-in" id="sheetIn"></div></section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
/* 실행 환경 설정. 토스 미니앱 빌드에서는 toss-app/scripts/sync.mjs 가 window.SC_CONFIG 를 넣어줌 */
const CFG = Object.assign({
  feedUrl: "feed.json",   // 공고 데이터 주소
  sample: true,           // 데이터가 없을 때 예시 공고를 보여줄지 (출시 빌드는 false)
  onboarding: false,      // 처음 연 사람에게 프로필 시트를 먼저 띄울지
  defaultProfile: {status:"student", school:"dankook", sido:"경기", sigungu:"용인시"}
}, window.SC_CONFIG || {});
const BR = () => window.SCBridge || {};   // 토스 SDK 연결부 (공유, 외부 링크, 광고). 없으면 브라우저 기본 동작
const DAY = 864e5, WD = ["일","월","화","수","목","금","토"];
const SRC = { school:{k:"학교",c:"s-school",i:"학"}, youth:{k:"청년정책",c:"s-youth",i:"청"}, gov24:{k:"정부지원",c:"s-gov",i:"정"} };
let SCHOOL_NAMES = { dankook:"단국대", ajou:"아주대", skku:"성균관대" };
const STATUSES = [
  ["student","대학생","재학 중 · 교내 장학금까지 모두"],
  ["leave","휴학생","학교 공지도 보여요. 재학 조건은 공고마다 확인하세요"],
  ["none","학교 안 다녀요","취준생, 직장인, 고졸 청년 · 청년정책과 정부지원만"]
];
let SCHOOLS = [["dankook","단국대학교"],["ajou","아주대학교"],["skku","성균관대학교"],["other","목록에 없어요"]];
/* 학생만 받을 수 있는 공고 (국가장학금, 근로장학 등) */
const studentOnly = it => it.source==="school" || it.audience==="student" ||
  /대학생|대학원생|재학생|학자금|국가장학|근로장학/.test((it.title||"")+" "+(it.eligibility||""));

/* 지역: 공고의 주관기관·제목에서 시·도 / 시·군·구를 읽어서, 다른 지역 전용 공고는 숨김 */
const SIDO = [["서울",/서울/],["부산",/부산/],["대구",/대구/],["인천",/인천/],["광주",/광주광역시|광주(?!시)/],["대전",/대전/],["울산",/울산/],["세종",/세종/],
  ["경기",/경기/],["강원",/강원/],["충북",/충북|충청북도/],["충남",/충남|충청남도/],["전북",/전북|전라북도/],["전남",/전남|전라남도/],["경북",/경북|경상북도/],["경남",/경남|경상남도/],["제주",/제주/]];
const SIGUNGU = {
  서울:"종로구 중구 용산구 성동구 광진구 동대문구 중랑구 성북구 강북구 도봉구 노원구 은평구 서대문구 마포구 양천구 강서구 구로구 금천구 영등포구 동작구 관악구 서초구 강남구 송파구 강동구".split(" "),
  경기:"수원시 성남시 의정부시 안양시 부천시 광명시 평택시 동두천시 안산시 고양시 과천시 구리시 남양주시 오산시 시흥시 군포시 의왕시 하남시 용인시 파주시 이천시 안성시 김포시 화성시 광주시 양주시 포천시 여주시 연천군 가평군 양평군".split(" "),
  인천:"중구 동구 미추홀구 연수구 남동구 부평구 계양구 서구 강화군 옹진군".split(" ")
};

/* 금액 문자열 → 최대 금액(만원). 시급·비율처럼 합계가 안 되는 건 null */
function maxWon(it){
  if (typeof it.amount_max==="number") return it.amount_max;
  const s = it.amount || "";
  if (/시급|%/.test(s)) return null;
  const m = [...s.matchAll(/(\d[\d,]*)\s*만\s*원/g)].map(x => +x[1].replace(/,/g,""));
  if (!m.length) return null;
  let v = Math.max(...m);
  const mon = s.match(/(\d+)\s*개월/);
  if (/월\s*(최대\s*)?\d/.test(s) && mon) v *= +mon[1];
  return v;
}
const won = n => n >= 10000 ? `${Math.floor(n/10000)}억${n%10000 ? ` ${(n%10000).toLocaleString()}만` : ""} 원` : `${n.toLocaleString()}만 원`;

function match(it){
  if (it.source==="school") return profile.status!=="none" && it.school===profile.school;
  if (profile.status==="none" && studentOnly(it)) return false;
  const sc = scopeOf(it);
  if (sc && profile.sido){
    if (sc.sido !== profile.sido) return false;
    if (sc.sigungu && profile.sigungu && sc.sigungu !== profile.sigungu) return false;
  }
  return true;
}

    <div><h3 id="sTitle">어떤 공고를 볼까요?</h3><p class="sub-t">받을 수 있는 공고만 골라서 보여드려요.</p></div>
    <div><p class="label">지금 나는</p><div class="opts" role="radiogroup" aria-label="신분">
      ${STATUSES.map(([k,t,s]) => opt("data-status",k,t,s,draft.status===k)).join("")}</div></div>
    <div id="schoolPick" ${draft.status==="none"?"hidden":""}><p class="label">다니는 학교</p><div class="opts" role="radiogroup" aria-label="학교">
      ${SCHOOLS.map(([k,t]) => opt("data-school",k,t,"",draft.school===k)).join("")}</div>
      <p class="hint">학교가 목록에 없으면 청년정책과 정부지원만 보여요. 학교는 계속 추가하고 있어요.</p></div>
    <div><p class="label">사는 곳 (주민등록 기준)</p><div class="sel-row">
      <div class="sel-wrap"><select class="select" id="sidoSel" aria-label="시·도">${SIDO.map(([k]) => `<option ${draft.sido===k?"selected":""}>${k}</option>`).join("")}</select>${CHEV}</div>
      <div class="sel-wrap"><select class="select" id="sggSel" aria-label="시·군·구">${sggOptions(draft.sido, draft.sigungu)}</select>${CHEV}</div>
    </div><p class="hint">다른 지역 전용 공고는 숨겨요. 전국 대상 공고는 항상 보여요.</p></div>
    <div class="actions one"><button class="btn main" id="applyProfile">적용하기</button></div>`;
  scrim.hidden = false; sheet.hidden = false; bySentence(sheet);
  requestAnimationFrame(() => { scrim.classList.add("on"); sheet.classList.add("on"); sheet.scrollTop = 0; sheet.querySelector('.opt[aria-checked="true"]')?.focus({preventScroll:true}); });
}

/* 상세 바텀시트 */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
let openId = null, lastFocus = null;
function openSheet(id){
  const it = items.find(i => i.id===id); if (!it) return;
  openId = id; lastFocus = document.activeElement;
  const d = days(it), s = SRC[it.source] || SRC.gov24, done = new Set(store.get("sc.docs."+id, []));
  const docs = it.docs || [];
  document.getElementById("sheetIn").innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    <div><span class="src-tag ${s.c}"><i></i>${s.k}${it.source==="school"?` · ${esc(where(it))}`:""}</span>
      <h3 id="sTitle">${esc(it.title)}</h3></div>
    <div class="big-d"><strong class="num ${ddClass(d)}">${ddLabel(d)}</strong><span>${it.deadline?fmtDate(it.deadline)+"까지":"마감일 없음"}</span></div>
    ${it.confidence==="low"?`<div class="warn">마감일을 자동으로 확실히 읽지 못했어요. 신청 전에 원문 날짜를 꼭 확인하세요.</div>`:""}
    <dl class="facts">
      ${it.amount?`<div class="fact"><dt>받는 것</dt><dd>${esc(it.amount)}</dd></div>`:""}
      ${it.eligibility?`<div class="fact"><dt>대상</dt><dd>${esc(it.eligibility)}</dd></div>`:""}
      ${it.source!=="school"&&it.region?`<div class="fact"><dt>주관</dt><dd>${esc(it.region)}</dd></div>`:""}
    </dl>
    ${it.summary?`<div class="summary"><b>한 줄 요약</b>${esc(it.summary)}</div>`:""}
    ${docs.length?`<div class="docs"><h4>준비 서류<span class="num" id="docCount">${done.size}/${docs.length}</span></h4>
      ${docs.map((x,n)=>`<button class="doc" role="checkbox" aria-checked="${done.has(n)}" data-doc="${n}"><span class="box"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5 9.5 3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="lbl">${esc(x)}</span></button>`).join("")}</div>`:""}
    <div class="actions">
      <button class="btn sub" id="saveBtn" aria-pressed="${saved.has(id)}" aria-label="찜하기">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="${saved.has(id)?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="btn sub" id="shareOne" aria-label="친구에게 공유">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg></button>
      <a class="btn main" href="${esc(it.url||"#")}" target="_blank" rel="noopener">원문 보고 신청하기</a>
    </div>`;
  scrim.hidden = false; sheet.hidden = false; bySentence(sheet);
  requestAnimationFrame(() => { scrim.classList.add("on"); sheet.classList.add("on"); sheet.scrollTop = 0; document.getElementById("saveBtn").focus({preventScroll:true}); });
}
function closeSheet(){
  scrim.classList.remove("on"); sheet.classList.remove("on"); openId = null;
  setTimeout(() => { if (!openId){ scrim.hidden = true; sheet.hidden = true; } }, 320);
  lastFocus?.focus?.({preventScroll:true});
}
let tt; function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),1600); }

document.addEventListener("click", e => {
  const ext = e.target.closest("a[href^='http']");
  if (ext && BR().openURL){ e.preventDefault(); BR().openURL(ext.href); return; }  // 토스 앱: 기본 브라우저로 열기
  if (e.target.closest("#retry")){ load(); return; }
  const chip = e.target.closest(".chip[data-f]"); if (chip){ filter = chip.dataset.f; selDay = null; store.set("sc.filter",filter); render(); return; }
  if (e.target.closest("#clearDay")){ selDay = null; render(); return; }
  const day = e.target.closest(".day[data-day]"); if (day && !day.disabled){ selDay = selDay===day.dataset.day ? null : day.dataset.day; filter="all"; render(); return; }
  const r = e.target.closest(".row[data-id]"); if (r){ openSheet(r.dataset.id); return; }
  if (e.target === scrim) { closeSheet(); return; }
  if (e.target.closest("#saveBtn")){
    const b = e.target.closest("#saveBtn"), on = !saved.has(openId);
    on ? saved.add(openId) : saved.delete(openId); store.set("sc.saved",[...saved]);
    b.setAttribute("aria-pressed",on); b.querySelector("path").setAttribute("fill", on?"currentColor":"none");
    toast(on ? "찜했어요. 마감 전에 다시 볼 수 있어요" : "찜을 해제했어요"); render(); return;
  }
  const doc = e.target.closest(".doc[data-doc]");
  if (doc){
    const key = "sc.docs."+openId, set = new Set(store.get(key, [])), n = +doc.dataset.doc;
    set.has(n) ? set.delete(n) : set.add(n); store.set(key,[...set]);
    doc.setAttribute("aria-checked", set.has(n));
    const it = items.find(i=>i.id===openId); document.getElementById("docCount").textContent = `${set.size}/${it.docs.length}`;
    if (set.size === it.docs.length) toast("서류 준비 끝! 이제 제출만 하면 돼요");
  }
  if (e.target.closest("#shareAll")) { copy(shareAllText()); return; }
  if (e.target.closest("#savedBtn")) { filter = "saved"; selDay = null; store.set("sc.filter",filter); render(); document.getElementById("groups").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (e.target.closest("#shareOne")) {
    const it = items.find(i => i.id===openId);
    if (it) copy(`이거 너도 해당될 것 같아!\n${it.title}\n${ddLabel(days(it))}${it.deadline ? ` (${fmtDate(it.deadline)}까지)` : ""}${it.amount ? ` · ${it.amount}` : ""}${it.url ? `\n${it.url}` : ""}`);
    return; }
  if (e.target.closest("#schoolBtn")) { openProfile(); return; }
  const st = e.target.closest(".opt[data-status]");
  if (st){ draft.status = st.dataset.status;
    document.querySelectorAll(".opt[data-status]").forEach(b => b.setAttribute("aria-checked", b===st));
    document.getElementById("schoolPick").hidden = draft.status==="none"; return; }
  const sc = e.target.closest(".opt[data-school]");
  if (sc){ draft.school = sc.dataset.school;
    document.querySelectorAll(".opt[data-school]").forEach(b => b.setAttribute("aria-checked", b===sc)); return; }
  if (e.target.closest("#applyProfile")){
    profile = draft; store.set("sc.profile", profile); selDay = null; closeSheet(); refresh();
    toast(`${items.length}개 공고를 맞춰서 보여드려요`); return; }
});
document.addEventListener("change", e => {
  if (!draft) return;
  if (e.target.id==="sidoSel"){ draft.sido = e.target.value; draft.sigungu = ""; document.getElementById("sggSel").innerHTML = sggOptions(draft.sido, ""); }
  if (e.target.id==="sggSel") draft.sigungu = e.target.value;
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && openId) closeSheet(); });

/* 수집기가 만든 feed.json 을 받아 실제 데이터로 */
function boot(feed){
  if (feed && Array.isArray(feed.items)){
    all = feed.items; isSample = false;
    if (Array.isArray(feed.schools) && feed.schools.length){   // 학교 목록도 feed 기준으로
      SCHOOLS = [...feed.schools.map(s => [s.id, s.name]), ["other","목록에 없어요"]];
      SCHOOL_NAMES = Object.fromEntries(feed.schools.map(s => [s.id, s.short || s.name.replace(/학교$/, "")]));
      if (profile.school !== "other" && !SCHOOL_NAMES[profile.school]) profile.school = "other";
    }
  } else all = SAMPLE;
  all = all.filter(i => days(i)===null || days(i) >= 0);
  document.getElementById("sampleNotice").hidden = !isSample;
  refresh();
}
function fail(){
  document.getElementById("groups").innerHTML =
    `<div class="empty-state"><strong>공고를 불러오지 못했어요</strong>인터넷 연결을 확인하고 다시 불러와 주세요<br><button class="chip" id="retry" style="margin-top:14px">다시 불러오기</button></div>`;
}
function load(){
  fetch(CFG.feedUrl, {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(boot)
    .catch(() => { if (!CFG.sample) fail(); });
}
if (CFG.sample) boot(null);
else document.getElementById("groups").innerHTML = `<div class="empty-state"><strong>공고를 불러오는 중이에요</strong>잠시만 기다려 주세요</div>`;
load();
if (CFG.onboarding && !store.get("sc.profile", null)) setTimeout(openProfile, 450);
window.SCApp = { adSlot: document.getElementById("adSlot") };
})();
</script>
