# 매일 아침 공고를 수집해서 feed.json 을 GitHub Pages 에 올려요.
# 미니앱은 이 주소(https://<아이디>.github.io/<저장소>/feed.json)에서 데이터를 읽어요.
name: collect

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 이미 읽은 학교 공지를 다시 AI로 처리하지 않도록 DB를 보관
      - uses: actions/cache@v4
        with:
          path: data/items.db
          key: items-db-${{ github.run_id }}
          restore-keys: items-db-

      - name: 수집
        run: python run.py all
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 수집이 통째로 실패해서 0건이면 배포하지 않음 → 어제 데이터가 그대로 유지돼요
      - name: 결과 확인
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("data/feed.json", encoding="utf-8"))
          n = len(d["items"])
          print(f"공고 {n}건")
          sys.exit(0 if n > 0 else 1)
          EOF

      - run: mkdir -p public && cp data/feed.json public/feed.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
